<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="crateLeft" x1="12" y1="30" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="crateRight" x1="32" y1="30" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="crateTop" x1="12" y1="22" x2="52" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="leafMain" x1="28" y1="8" x2="48" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="55%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <radialGradient id="tomatoGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FCA5A5" />
      <stop offset="35%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </radialGradient>
  </defs>

  <!-- 3D Rounded Tile Backdrop -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" />
  <rect x="3" y="3" width="58" height="58" rx="14" stroke="#34D399" stroke-opacity="0.28" stroke-width="1.5" />

  <!-- Ground Drop Shadow -->
  <ellipse cx="32" cy="54.5" rx="19" ry="3.5" fill="#011914" fill-opacity="0.6" />

  <!-- Isometric Produce Crate: Top Rim & Interior Cavity -->
  <polygon points="32,19 52,29 32,39 12,29" fill="url(#crateTop)" />
  <polygon points="32,21.5 47,29 32,36.5 17,29" fill="#451A03" />

  <!-- Fresh Produce Inside Open Crate -->
  <!-- Ripe 3D Tomato -->
  <circle cx="27" cy="26.5" r="6.2" fill="url(#tomatoGrad)" />
  <ellipse cx="24.8" cy="24.2" rx="1.8" ry="1.1" transform="rotate(-25 24.8 24.2)" fill="#FECACA" fill-opacity="0.85" />

  <!-- Sculpted 3D Emerald Leaf -->
  <path d="M31 29.5C29.5 21 34 12.5 46.5 11C46 21.5 40 28.5 31 29.5Z" fill="url(#leafMain)" stroke="#A7F3D0" stroke-width="0.9" stroke-linejoin="round" />
  <path d="M31.5 28.8C35.5 23 40 17.8 45.2 12.5" stroke="#ECFDF5" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- Isometric Produce Crate: Left Face -->
  <polygon points="12,29 32,39 32,54 12,44" fill="url(#crateLeft)" />
  <!-- Left Face 3D Slats -->
  <path d="M14.5 34.5L29.5 42" stroke="#78350F" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.55" />
  <path d="M14.5 40L29.5 47.5" stroke="#78350F" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.55" />

  <!-- Isometric Produce Crate: Right Face -->
  <polygon points="52,29 32,39 32,54 52,44" fill="url(#crateRight)" />
  <!-- Right Face 3D Slats -->
  <path d="M49.5 34.5L34.5 42" stroke="#451A03" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.6" />
  <path d="M49.5 40L34.5 47.5" stroke="#451A03" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.6" />

  <!-- Crisp 3D Bevel Edge Highlights -->
  <polyline points="12,29 32,39 52,29" stroke="#FEF3C7" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.8" />
  <line x1="32" y1="39" x2="32" y2="54" stroke="#FDE68A" stroke-width="1.1" stroke-opacity="0.5" />
</svg>
